name: recap-studio

x-backend-environment: &backend-environment
  APP_ENV: development
  STORAGE_BACKEND: minio
  PROCESSING_MODE: celery
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recap}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT_URL: http://storage:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-local-minio}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-local-minio-development-only}
  S3_BUCKET: ${S3_BUCKET:-recap-private}
  S3_REGION: ${S3_REGION:-us-east-1}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  migrate:
    build: ./backend
    command: alembic upgrade head
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  frontend:
    build: ./frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports: ["3001:3000"]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: ./backend
    environment: *backend-environment
    ports: ["8001:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  worker:
    build: ./backend
    command: celery -A app.worker:celery_app worker --loglevel=INFO --concurrency=2 --queues=system
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-recap}
    ports: ["5433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.5-bookworm
    command: redis-server --appendonly yes
    ports: ["6380:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  storage:
    image: quay.io/minio/aistor/minio:RELEASE.2026-09-19T17-05-25Z@sha256:107cf2014a9583c74c11e3cdbd6903d89c2244355886b89ce532f4ecae9c23f3
    command: server /mnt/data --console-address ':9001' --license /run/secrets/minio.license
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-development-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["storage-data:/mnt/data"]
    secrets:
      - minio.license
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  storage-init:
    image: recap-studio-backend
    build: ./backend
    depends_on:
      storage:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-minio-development-only}
      S3_BUCKET: ${S3_BUCKET:-recap-private}
    command:
      - python
      - -c
      - |
        import os
        import boto3
        c = boto3.client('s3', endpoint_url='http://storage:9000', aws_access_key_id=os.environ['MINIO_ROOT_USER'], aws_secret_access_key=os.environ['MINIO_ROOT_PASSWORD'], region_name='us-east-1')
        bucket = os.environ['S3_BUCKET']
        if not any(item['Name'] == bucket for item in c.list_buckets()['Buckets']):
            c.create_bucket(Bucket=bucket)
        c.delete_bucket_policy(Bucket=bucket)
        c.head_bucket(Bucket=bucket)
        print('Private storage bucket initialized')

volumes:
  postgres-data:
  redis-data:
  storage-data:

secrets:
  minio.license:
    file: ${MINIO_LICENSE_PATH:?Set MINIO_LICENSE_PATH to the local AIStor license file}
